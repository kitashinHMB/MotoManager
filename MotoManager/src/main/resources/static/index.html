<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoManager</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header class="header">
        <h1>🏍 MotoManager</h1>
    </header>

    <main class="container">
        <section class="hero">
            <p class="subtitle">MOTORCYCLE MANAGEMENT</p>
            <h2>愛車の状態を、ひと目で。</h2>
            <p>整備記録やメンテナンス予定をまとめて管理。</p>
        </section>

        <section class="motorcycle-section">
            <h3>MY MOTORCYCLE</h3>
            <p>まだバイクが登録されていません。</p>
            <button id="registerButton">
                ＋ バイクを登録する
            </button>
        </section>

        <section class="menu">
            <h3>MENU</h3>
            <div class="menu-list">
                <div class="menu-item">整備記録</div>
                <div class="menu-item">整備履歴</div>
                <div class="menu-item">メンテナンス予定</div>
                <div class="menu-item">走行距離管理</div>
            </div>
        </section>
    </main>

    <script src="/js/main.js"></script>
</body>

</html>
